<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="controls">
        <div class="godMode">
            <label for="godMode">Enter your godMode Code</label>
            <br>
            <input type="number" id="godModeCode" placeholder="God Mode Code">
            <br>
            <button id="godModeButton">Submit</button>
            <br>
            <input type="text" id="godModeCodeInput" placeholder="Enter god mode code">
            <button id="submitGodModeCode">Submit</button>
        </div>
        <label for="speed">Speed: </label>
        <input type="range" id="speedRange" min="50" max="500" value="100" step="50">
        <span id="speedDisplay">100ms</span>
    </div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <script src="snake.js"></script>
</body>
<style>
   .controls {
    margin: 10px 0;
    text-align: center;
   }
   .controls label {
    margin-right: 10px;
   }
</style>
</html>
